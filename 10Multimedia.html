<!-- 
# Embedding Multimedia in HTML: Video, Audio, and More

1. Embed a video on a webpage with the following:
    • Add controls, autoplay, and a poster image.
    • Add subtitles using the <track> tag.
2. Create an audio player with two different audio formats.
3. Embed a YouTube video using an <iframe>
4. Create a table listing three common video and audio formats, along with their descriptions. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia</title>
</head>
<body>
    
    <video src="/Codeing.mp4"  controls poster="/Metro.jpg" width="80%"></video>


    <iframe width="560" height="315" src="https://www.youtube.com/embed/KWwxwRNttns?si=FF1sNmXiLOen2Neg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/tK1lXxdZn7g?si=IDYwB0PZQ1NVoxbk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
