<!-- 
 # HTML Fundamentals: Title, Headings, Paragraphs, and Meta Tags
1. Write a basic HTML page with a title, heading, and a paragraph.
2. Add meta tags for character encoding and viewport.
3. Insert a comment in the body section explaining the content. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    
    <!-- Read This Page for learn Meta Tag -> 
      https://developers.google.com/search/docs/crawling-indexing/special-tags -->

        <!-- Specifies the character encoding (UTF-8 supports most languages) -->
        <meta charset="UTF-8">

        <!-- Makes the page responsive to different screen sizes (important for mobile) -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Describes the content of the page (used by search engines) -->
        <meta name="description" content="A basic HTML page with meta tags and comments.">

        <!-- States who the author of the page is -->
        <meta name="author" content="Your Name">


    <title>Basic HTML</title>
</head>
<body>
    <h3>Heading Tag there 6 Heading Tag</h3>
  <hr>
    <h1>Heading 1 </h1>
    <h2>Heading 2 </h2>
    <h3>Heading 3 </h3>
    <h4>Heading 4 </h4>
    <h5>Heading 5 </h5>
    <h6>Heading 6 </h6>    
    <hr>
    <p>Paragraph Tag</p>
</body>
</html>
