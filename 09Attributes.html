<!-- 
# HTML Attribute Fundamentals: Structure, Style, and Custom Data

1. Create a webpage with:
    • A paragraph with an id and class attribute.
    • An anchor tag with a title and target attribute.
    • An input field with required and placeholder attributes.
2. Create a styled paragraph using the style attribute.
3. Use the data-* attribute to store custom data. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute</title>
</head>
<body>
    <main> 
        <p id="pid" class="pclass"> This is paragraph </p>

        <a href="https://docs.emmet.io/cheat-sheet/" target="_blank" ><h1>Emmet Documentation</h1></a>


        <form aria-label="Name Form">
            <label for="textbox"> Enter Your Name here: </label>
            <input type="text" placeholder="Enter Text here" id="textbox" required name="name">
            <button type="submit">Submit Form</button>
        </form>
    </main>
</body>
</html>
