<!-- 
Building Interactive Webpages with Forms, Media, and Canvas

1. Create a form with the following fields:
    • Email (required)
    • Date of birth (date picker)
    • Favorite color (color picker)
2. Embed a video with a poster image and controls.
3. Draw a rectangle using the <canvas> element and JavaScript. If you are total fresher, ignore this task -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


    </style>
</head>

<body>
    <form>
        <label for="email">Email ID : </label>
        <input type="email" name="email" id="email" required>
        <br>
        <label for="DOB">Date of birth : </label>
        <input type="date" name="DOB" id="DOB">
        <br>
        <label for="color">Favorite color : </label>
        <input type="color" name="color" id="color">


    </form>

    <!-- 2. Embed a video with a poster image and controls. -->

    <video src="/Codeing.mp4" poster="/Npc.jpg" controls aria-controls="true" height="360" width=" 200px">
        <source media="(min-width:500px )" srcset="/Npc.jpg">
    </video>

    <video width="640" height="360" controls poster="/Npc.jpg">
        <source src="/Codeing.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>


    <video height="200px" width="200px" controls poster="/Npc.jpg"> 
        <source src="/Codeing.mp4" type="video/mp4">
    </video>
      
    <!-- 3. Draw a rectangle using the <canvas> element and JavaScript. If you are total fresher, ignore this task -->

<canvas id="myCanvas" width="200" height="100" style="border: blueviolet solid 2px; display: block;"></canvas>
 

</body>

</html>
